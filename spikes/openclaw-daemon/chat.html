<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>初序 · 五行体质测评</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-light: #252836;
            --border: #2e3142;
            --primary: #6c63ff;
            --primary-glow: rgba(108, 99, 255, 0.3);
            --accent: #00d4aa;
            --text: #e8e8ef;
            --text-dim: #8b8da3;
            --user-bubble: linear-gradient(135deg, #6c63ff, #4f46e5);
            --bot-bubble: #252836;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(20px);
        }
        .header-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .header-info h1 { font-size: 16px; font-weight: 600; }
        .header-info p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .status-dot {
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .message {
            max-width: 78%;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; }
        .message.bot { align-self: flex-start; }

        .message .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.7;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.user .bubble {
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        .message.bot .bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
        }
        .message .meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 6px;
            padding: 0 4px;
        }
        .message.user .meta { text-align: right; }

        /* Typing indicator */
        .typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
        .typing-dots span {
            width: 7px; height: 7px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input */
        .input-area {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2px;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .input-wrapper textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            padding: 12px 16px;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
        }
        .input-wrapper textarea::placeholder { color: var(--text-dim); }

        .send-btn {
            width: 46px; height: 46px;
            background: var(--primary);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover { background: #5b54e6; transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { background: var(--surface-light); cursor: not-allowed; transform: none; }

        /* Quick actions */
        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 24px 12px;
        }
        .quick-btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .quick-btn:hover {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-icon">🌿</div>
        <div class="header-info">
            <h1>初序 · AI 养生伴侣</h1>
            <p><span class="status-dot"></span>五行体质测评 Bot 在线</p>
        </div>
    </div>

    <div class="chat-container" id="chat">
    </div>

    <div class="quick-actions" id="quickActions">
        <button class="quick-btn" onclick="quickSend('帮我测测体质')">🔮 测体质</button>
        <button class="quick-btn" onclick="quickSend('今天吃什么')">🍽️ 今天吃什么</button>
        <button class="quick-btn" onclick="quickSend('你好，介绍一下你自己')">👋 打个招呼</button>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="输入你的消息..." autofocus></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const quickActions = document.getElementById('quickActions');
        let isWaiting = false;
        let conversationHistory = [];
        // 每次打开页面生成新的 session_id，确保新对话不带旧历史
        const sessionId = 'sess_' + Math.random().toString(36).substring(2, 10);

        // Auto-detect API base URL (local dev vs deployed)
        const API_BASE = location.protocol === 'file:'
            ? 'http://localhost:8000'
            : `${location.protocol}//${location.host}`;

        // 自动向 Bot 发送初始化请求，获取真正的欢迎词
        (async function initBotGreeting() {
            showTyping();
            conversationHistory.push({ role: 'user', content: '你好' });
            try {
                const res = await fetch(`${API_BASE}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'coze-wuxing-bot',
                        messages: conversationHistory,
                        session_id: sessionId,
                        stream: true
                    })
                });
                removeTyping();
                if (!res.ok) {
                    appendMessage('⚠️ 连接失败，请刷新重试', false);
                    return;
                }
                const botBubble = appendMessage('', false);
                let fullReply = '';
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;
                        const payload = trimmed.slice(6);
                        if (payload === '[DONE]') continue;
                        try {
                            const chunk = JSON.parse(payload);
                            const delta = chunk.choices?.[0]?.delta?.content || '';
                            if (delta) {
                                fullReply += delta;
                                botBubble.textContent = fullReply;
                                chat.scrollTop = chat.scrollHeight;
                            }
                        } catch (e) {}
                    }
                }
                if (!fullReply) botBubble.textContent = '你好！我是初序 AI 养生伴侣 🌿';
                conversationHistory.push({ role: 'assistant', content: fullReply });
            } catch (err) {
                removeTyping();
                appendMessage('你好！我是初序 AI 养生伴侣 🌿\n可以试试下方的快捷按钮，或者直接输入你想问的问题～', false);
            }
        })();

        // Auto-resize textarea
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function timeNow() {
            return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function appendMessage(text, isUser) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message ' + (isUser ? 'user' : 'bot');

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = isUser ? timeNow() : '初序 · ' + timeNow();

            wrapper.appendChild(bubble);
            wrapper.appendChild(meta);
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }

        function showTyping() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message bot';
            wrapper.id = 'typing-indicator';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

            wrapper.appendChild(bubble);
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function quickSend(text) {
            input.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text || isWaiting) return;

            isWaiting = true;
            sendBtn.disabled = true;
            quickActions.style.display = 'none';
            input.value = '';
            input.style.height = 'auto';

            appendMessage(text, true);
            showTyping();

            conversationHistory.push({ role: 'user', content: text });

            try {
                const res = await fetch(`${API_BASE}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'coze-wuxing-bot',
                        messages: conversationHistory,
                        session_id: sessionId,
                        stream: true
                    })
                });

                removeTyping();

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    appendMessage('⚠️ 请求失败：' + (errData.detail || res.statusText), false);
                    return;
                }

                // Create bot bubble for streaming text
                const botBubble = appendMessage('', false);
                let fullReply = '';

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep incomplete line in buffer

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;
                        const payload = trimmed.slice(6);
                        if (payload === '[DONE]') continue;

                        try {
                            const chunk = JSON.parse(payload);
                            const delta = chunk.choices?.[0]?.delta?.content || '';
                            if (delta) {
                                fullReply += delta;
                                botBubble.textContent = fullReply;
                                chat.scrollTop = chat.scrollHeight;
                            }
                        } catch (e) { /* skip malformed chunks */ }
                    }
                }

                if (!fullReply) {
                    botBubble.textContent = '(Bot 没有返回内容)';
                }

                conversationHistory.push({ role: 'assistant', content: fullReply });

            } catch (err) {
                removeTyping();
                appendMessage('⚠️ 网络错误：' + err.message, false);
            } finally {
                isWaiting = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
